name: release

# Publishes a GitHub release with the Windows and macOS installers. Bump the
# version in package.json, update .github/release-notes.md, then push a
# matching tag (v1.2.3), or run this workflow by hand to tag the current commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in package.json ($tag)"
            exit 1
          fi
          ls -l dist
          gh release create "$tag" dist/DeepSeek-Pet-* --target "$GITHUB_SHA" --title "DeepSeek-Pet $tag" --notes-file .github/release-notes.md
