name: build

# Packages the desktop pet for Windows and macOS on every pull request and
# every push to main; the installers show up as artifacts on the run page.
#
# To publish a release: bump the version in package.json, update
# .github/release-notes.md, then push a matching tag (v1.2.3) or run this
# workflow by hand with "release" ticked. The release job tags the commit
# and publishes the installers as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release for the version in package.json
        type: boolean
        default: false

jobs:
  # "package (windows-latest)" and "package (macos-latest)" must pass before a
  # pull request can merge into main (repository ruleset); renaming the job or
  # the matrix means updating the ruleset too.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Pet-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || inputs.release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in package.json ($tag)"
            exit 1
          fi
          ls -l dist
          gh release create "$tag" dist/DeepSeek-Pet-* --target "$GITHUB_SHA" --title "DeepSeek-Pet $tag" --notes-file .github/release-notes.md
